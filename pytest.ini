[pytest]
# Make the repo root importable so `from benchmark.X import Y` works without
# installing the project. Requires pytest>=7.0 (we pin >=7.4 in requirements.txt).
pythonpath = .
testpaths = tests
addopts = -ra
filterwarnings =
    # pandas / matplotlib often warn on FutureWarning chatter that's not ours.
    ignore::DeprecationWarning:matplotlib
    ignore::FutureWarning:pandas
